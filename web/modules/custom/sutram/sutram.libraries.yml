# The build of the @d34dman/sutram npm package, one ES module committed in
# web/libraries/sutram (refresh with npm run sutram:update). Loaded as a
# module, outside aggregation.
sutram:
  version: 0.2.1
  remote: https://github.com/d34dman/sutram
  license:
    name: MIT OR GPL-2.0-or-later
    url: https://github.com/d34dman/sutram/blob/main/LICENSE
    gpl-compatible: true
  js:
    /libraries/sutram/sutram.js: { attributes: { type: module }, preprocess: false, minified: true }

# Drupal's own providers: nav (menus) and page.
drupal:
  js:
    js/sutram.drupal.js: { attributes: { type: module }, preprocess: false }
  dependencies:
    - core/drupalSettings
    - sutram/sutram

# The form provider: form <form-id> status, fields, get, set, save, discard.
# Attached by content entity forms (SutramForms).
form:
  js:
    js/sutram.form.js: { attributes: { type: module }, preprocess: false }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - sutram/sutram
