sutram.settings:
  type: config_object
  label: 'Sutram settings'
  mapping:
    menus:
      type: sequence
      label: 'Menus exposed as the nav provider'
      sequence:
        type: mapping
        label: 'Menu'
        mapping:
          menu:
            type: string
            label: 'Menu machine name'
            constraints:
              ConfigExists:
                prefix: system.menu.
          depth:
            type: integer
            label: 'Levels to include'
            constraints:
              Range:
                min: 1
                max: 9
